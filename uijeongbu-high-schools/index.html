<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>의정부시 고등학교 스트리트맵</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3E9vQJ3y2wK5r5s6v7fHc4aR4M3mE=" crossorigin="">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #172033; background: #f4f7fb; }
    html, body { min-height: 100%; margin: 0; }
    body { background: #f4f7fb; }
    .shell { max-width: 1280px; margin: auto; padding: 24px; }
    .eyebrow { margin: 0 0 6px; color: #2563eb; font-size: .75rem; font-weight: 800; letter-spacing: .12em; }
    h1, h2 { margin: 0; } header { margin-bottom: 18px; }
    header p:last-child { color: #64748b; }
    .dashboard { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr); gap: 18px; align-items: start; }
    #map { height: 560px; min-height: 0; width: 100%; overflow: hidden; border-radius: 16px; box-shadow: 0 8px 24px #17203318; }
    .panel { min-width: 0; min-height: 0; padding: 16px; background: white; border-radius: 16px; box-shadow: 0 8px 24px #17203312; }
    .panel-heading { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .panel-heading h2 { font-size: 1.1rem; }
    #school-count, footer { color: #64748b; font-size: .82rem; }
    #school-type { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #172033; }
    .table-wrap { overflow: visible; }
    table { width: 100%; border-collapse: collapse; font-size: .78rem; }
    th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid #e8edf3; vertical-align: middle; }
    th { position: sticky; top: 0; background: white; color: #64748b; font-size: .7rem; z-index: 1; }
    tbody tr { cursor: pointer; } tbody tr:hover { background: #eff6ff; }
    td.school-name-cell { font-weight: 700; word-break: keep-all; } td.school-meta-cell { color: #64748b; font-size: .72rem; white-space: nowrap; }
    .school-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .school-meta { color: #475569; font-size: .85rem; }
    .school-links { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .school-links a { color: #075985; }
    .legend { background: white; padding: 9px 11px; border-radius: 6px; box-shadow: 0 1px 6px #0003; font-size: .8rem; line-height: 1.45; }
    .legend strong { display: block; margin-bottom: 3px; }
    footer { margin-top: 14px; }
    @media (max-width: 850px) { .shell { padding: 14px; } .dashboard { grid-template-columns: 1fr; } #map { height: 420px; min-height: 0; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">UIJEONGBU SCHOOL MAP</p>
      <h1>의정부시 고등학교 지도</h1>
      <p>의정부 소재 고등학교 16개교 · 학교 유형을 선택해 목록과 지도 마커를 함께 필터링할 수 있습니다.</p>
    </header>
    <section class="dashboard">
      <div id="map" aria-label="의정부시 고등학교 지도"></div>
      <section class="panel" aria-label="의정부시 고등학교 목록">
        <div class="panel-heading">
          <h2>학교 목록 <span id="school-count">(16개교)</span></h2>
          <label for="school-type"><span class="sr-only">학교 유형</span>
            <select id="school-type">
              <option value="전체">전체</option>
              <option value="남학교">남학교</option>
              <option value="여학교">여학교</option>
              <option value="공학">공학</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>번호</th><th>학교</th><th>유형·주소</th></tr></thead>
            <tbody id="school-rows"></tbody>
          </table>
        </div>
      </section>
    </section>
    <footer>지도 © OpenStreetMap contributors · 학교 목록: 공개 교육정보 기준</footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const schools = [
      { name: "의정부고등학교", type: "공립 · 남학교", address: "경기도 의정부시 녹양로 29", lat: 37.7545848, lon: 127.0310564 },
      { name: "의정부여자고등학교", type: "공립 · 여학교", address: "경기도 의정부시 신흥로365번길 10", lat: 37.7496476, lon: 127.0412921 },
      { name: "경민고등학교", type: "사립 · 남녀공학", address: "경기도 의정부시 서부로 545", lat: 37.7472963, lon: 127.0249839 },
      { name: "송현고등학교", type: "공립 · 남녀공학", address: "경기도 의정부시 용민로 159", lat: 37.7436714, lon: 127.0909098 },
      { name: "호원고등학교", type: "공립 · 남녀공학", address: "경기도 의정부시 망월로 56", lat: 37.7053485, lon: 127.0444832 },
      { name: "상우고등학교", type: "사립 · 남녀공학", address: "경기도 의정부시 범골로 79", lat: 37.7314563, lon: 127.0375154 },
      { name: "부용고등학교", type: "공립 · 남녀공학", address: "경기도 의정부시 오목로 96", lat: 37.7362596, lon: 127.0927056 },
      { name: "의정부광동고등학교", type: "사립 · 남녀공학", address: "경기도 의정부시 서부로 691", lat: 37.7540994, lon: 127.0366979 },
      { name: "효자고등학교", type: "공립 · 남녀공학", address: "경기도 의정부시 부용로 165", lat: 37.7529272, lon: 127.0764186 },
      { name: "경기북과학고등학교", type: "공립 · 남녀공학 · 과학고", address: "경기도 의정부시 체육로135번길 32", lat: 37.7587157, lon: 127.0197308 },
      { name: "발곡고등학교", type: "공립 · 남녀공학", address: "경기도 의정부시 동일로454번길 150", lat: 37.7284825, lon: 127.0675133 },
      { name: "경민IT고등학교", type: "사립 · 남녀공학 · 특성화고", address: "경기도 의정부시 서부로 545", lat: 37.7467719, lon: 127.0245403 },
      { name: "동국대학교사범대학부속영석고등학교", type: "사립 · 남학교", address: "경기도 의정부시 시민로 363", lat: 37.7367429, lon: 127.0742411 },
      { name: "경민비즈니스고등학교", type: "사립 · 여학교 · 특성화고", address: "경기도 의정부시 서부로 545", lat: 37.7454800, lon: 127.0238486 },
      { name: "송양고등학교", type: "공립 · 남녀공학", address: "경기도 의정부시 송양로 6", lat: 37.7530424, lon: 127.1066845 },
      { name: "의정부공업고등학교", type: "공립 · 남녀공학 · 특성화고", address: "경기도 의정부시 가능로 136번길 29", lat: 37.7461133, lon: 127.0465323 }
    ];

    const SINGOK_CENTER = [37.7374524, 127.0600135];
    const map = L.map('map', { zoomControl: true }).setView(SINGOK_CENTER, 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markers = [];
    schools.forEach((school, index) => {
      const point = [school.lat, school.lon];
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(school.name + ' ' + school.address)}`;
      const osmUrl = `https://www.openstreetmap.org/?mlat=${school.lat}&mlon=${school.lon}#map=18/${school.lat}/${school.lon}`;
      const marker = L.marker(point).addTo(map);
      markers.push(marker);
      marker.bindPopup(`
        <div class="school-name">${index + 1}. ${school.name}</div>
        <div class="school-meta">${school.type}</div>
        <div class="school-meta">${school.address}</div>
        <div class="school-links">
          <a href="${mapUrl}" target="_blank" rel="noopener">Google 지도</a>
          <a href="${osmUrl}" target="_blank" rel="noopener">OSM 위치</a>
        </div>
      `);
    });

    const list = document.getElementById('school-rows');
    const count = document.getElementById('school-count');
    const typeSelect = document.getElementById('school-type');

    function renderSchools(filter) {
      const filtered = filter === '전체'
        ? schools.map((school, index) => ({ school, index }))
        : schools.map((school, index) => ({ school, index })).filter(({ school }) => school.type.includes(filter));
      list.replaceChildren();
      count.textContent = `(${filtered.length}개교)`;
      filtered.forEach(({ school, index }) => {
        const item = document.createElement('tr');
        item.tabIndex = 0;
        item.innerHTML = `<td>${index + 1}</td><td class="school-name-cell" title="${school.address}">${school.name}</td><td class="school-meta-cell" title="${school.address}">${school.type}</td>`;
        const openSchool = () => {
          markers[index].openPopup({ autoPan: false });
        };
        item.addEventListener('click', openSchool);
        item.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openSchool(); } });
        list.appendChild(item);
      });
      markers.forEach((marker, index) => {
        const visible = filtered.some(({ index: schoolIndex }) => schoolIndex === index);
        if (visible) marker.addTo(map); else map.removeLayer(marker);
      });
      if (filtered.length) map.setView(SINGOK_CENTER, fixedZoom);
    }

    const allBounds = L.latLngBounds(schools.map(school => [school.lat, school.lon]));
    map.fitBounds(allBounds, { padding: [28, 28] });
    const fixedZoom = Math.max(10, map.getZoom() - 1);
    map.setView(SINGOK_CENTER, fixedZoom);
    typeSelect.addEventListener('change', event => renderSchools(event.target.value));
    renderSchools('전체');
    window.addEventListener('resize', () => map.invalidateSize());
    requestAnimationFrame(() => map.invalidateSize());
    const legend = L.control({ position: 'topright' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `<strong>표시 학교</strong>${schools.length}개교`;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
